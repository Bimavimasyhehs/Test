<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Text — YANG BACA MONYET 😝</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-deep:#0b1220;
      --bg-mid:#0f172a;
      --primary:#ffcc00;
      --accent:#ff5c8a;
      --shadow: rgba(0,0,0,0.55);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      display:grid;
      place-items:center;
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
      -webkit-font-smoothing:antialiased;
      background: radial-gradient(1000px 600px at 10% 10%, rgba(255,92,138,0.06), transparent),
                  radial-gradient(900px 500px at 90% 90%, rgba(255,204,0,0.04), transparent),
                  linear-gradient(180deg,var(--bg-mid),var(--bg-deep));
      color:#fff;
      overflow:hidden;
    }

    .stage{
      perspective:1200px;
      text-align:center;
      padding:40px;
    }

    .wrap{
      display:inline-block;
      transform-style: preserve-3d;
      animation: float 5s ease-in-out infinite;
      cursor:default;
    }

    @keyframes float{
      0%,100%{ transform: rotateX(8deg) rotateY(-14deg) translateY(0); }
      50%{ transform: rotateX(6deg) rotateY(-8deg) translateY(-15px); }
    }

    h1.extrude{
      margin:0;
      font-size:clamp(36px, 9vw, 110px);
      line-height:0.9;
      letter-spacing:0.03em;
      position:relative;
      transform-style:preserve-3d;
      display:inline-block;
      color:var(--primary);
      font-weight:900;
      text-shadow: 0 6px 30px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.04);
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow{
      0%,100%{ text-shadow: 0 6px 30px rgba(0,0,0,0.6), 0 0 10px var(--primary); }
      50%{ text-shadow: 0 6px 30px rgba(0,0,0,0.6), 0 0 25px var(--accent); }
    }

    h1.extrude::before{
      content:attr(data-text);
      position:absolute; left:0; top:0;
      z-index:-1;
      color:var(--accent);
      transform:translateZ(-34px) rotateX(12deg);
      text-shadow:
        1px 0 0 var(--shadow), 2px 0 0 var(--shadow), 3px 0 0 var(--shadow),
        5px 0 0 rgba(0,0,0,0.5), 8px 0 0 rgba(0,0,0,0.45), 12px 0 0 rgba(0,0,0,0.38),
        18px 0 0 rgba(0,0,0,0.30), 24px 0 0 rgba(0,0,0,0.22), 30px 0 0 rgba(0,0,0,0.14);
      filter:blur(.2px);
      opacity:.95;
    }

    p.note{ margin-top:18px; opacity:0.75; font-weight:600; font-size:0.95rem; animation: fadeIn 2s ease-in-out forwards; }

    @keyframes fadeIn{
      from{ opacity:0; transform:translateY(20px); }
      to{ opacity:.75; transform:translateY(0); }
    }

    .emoji{ display:inline-block; transform:translateY(6px) rotate(-12deg) scale(1.02); font-size:0.9em; animation: wiggle 2s ease-in-out infinite; }

    @keyframes wiggle{
      0%,100%{ transform:translateY(6px) rotate(-12deg) scale(1.02); }
      50%{ transform:translateY(3px) rotate(-2deg) scale(1.1); }
    }

    @media (max-width:480px){
      h1.extrude{ letter-spacing:0 }
      p.note{ font-size:0.86rem }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="wrap">
      <h1 class="extrude" data-text="YANG BACA MONYET 😝">YANG BACA MONYET <span class="emoji">😝</span></h1>
      <p class="note"></p>
    </div>
  </div>
</body>
</html>
