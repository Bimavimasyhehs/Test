<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>😝</title>
  <style>
    :root{
      --bg:#0b0b12;
      --pink:#ff2fb9;
      --pink2:#ff6fd8;
      --pink3:#ff99e3;
      --white:#fff7fb;
    }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0;}
    body{
      background: radial-gradient(1200px 800px at center, #101020 0%, var(--bg) 60%, #05050a 100%);
      overflow:hidden;
      font-family: system-ui, sans-serif;
    }

    .wrap{
      position:relative;
      z-index:2;
      display:grid;
      place-items:center;
      height:100%;
      text-align:center;
    }

    h1.neon{
      margin:0;
      font-size: clamp(44px, 8vw, 100px);
      font-weight:800;
      letter-spacing: .08em;
      color: var(--white);
      text-transform: uppercase;
      text-shadow:
        0 0 0.06em var(--white),
        0 0 0.12em var(--pink),
        0 0 0.22em var(--pink),
        0 0 0.5em var(--pink2),
        0 0 1.2em var(--pink2),
        0 0 2.2em var(--pink3),
        0 0 3.2em var(--pink3);
      animation: flicker 3.5s infinite steps(60), blink 1.2s infinite;
      position:relative;
    }

    @keyframes flicker{
      0%, 1%, 2%, 3% { opacity: .97; }
      4%{ opacity:.6 }
      5%{ opacity:1 }
      6%{ opacity:.85 }
      7%{ opacity:1 }
      8%{ opacity:.9 }
      9%, 100%{ opacity:1 }
    }
    @keyframes blink{
      0%{ filter: drop-shadow(0 0 8px var(--pink2)); }
      50%{ filter: drop-shadow(0 0 18px var(--pink3)); }
      100%{ filter: drop-shadow(0 0 8px var(--pink2)); }
    }

    canvas#fx{
      position:fixed; inset:0; z-index:1; display:block; width:100vw; height:100vh; background:transparent;
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="wrap">
    <h1 class="neon" id="title">CINDYIMUT</h1>
  </div>

  <script>
    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d');

    function resize(){
      const dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    resize();
    window.addEventListener('resize',resize);

    function drawHeart(x, y, size, glow){
      ctx.save();
      ctx.translate(x,y);
      ctx.scale(size,size);
      ctx.beginPath();
      for(let t=0; t<=Math.PI; t+=Math.PI/32){
        const sx = 16 * Math.pow(Math.sin(t),3);
        const sy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        const px = sx / 18;
        const py = -(sy / 18);
        if(t===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fillStyle = "pink";
      ctx.shadowColor = glow;
      ctx.shadowBlur = 30;
      ctx.fill();
      ctx.restore();
    }

    // Partikel outline hati
    const particles = [];
    const N = 250; // titik lebih rapat
    let scaleBase = 13; // ukuran dasar hati
    const cx = innerWidth/2, cy = innerHeight/2+5;

    for(let i=0;i<N;i++){
      const t = (Math.PI*2) * (i/N);
      const x = 16 * Math.pow(Math.sin(t),3);
      const y = 13 * Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
      particles.push({x, y, offset: Math.random()*6.28});
    }

    // Partikel kecil yang melayang (sparkle)
    const sparkles = [];
    function addSparkle(){
      sparkles.push({
        x: cx,
        y: cy,
        size: Math.random()*1.5+0.5,
        vx: (Math.random()-0.5)*1.5,
        vy: -Math.random()*2-1,
        life: 100
      });
    }

    function tick(){
      ctx.clearRect(0,0,canvas.width,canvas.height);

      // efek detak jantung
      const beat = 1 + Math.sin(Date.now()/600)*0.1;
      const scale = scaleBase * beat;

      particles.forEach(p=>{
        const px = cx + p.x*scale;
        const py = cy - p.y*scale;
        const pulse = Math.sin(Date.now()/500 + p.offset)*1.5;
        drawHeart(px, py+pulse, 1.3, "deeppink");
      });

      // update sparkles
      if(Math.random()<0.1) addSparkle();
      for(let i=sparkles.length-1;i>=0;i--){
        const s = sparkles[i];
        s.x += s.vx;
        s.y += s.vy;
        s.life--;
        ctx.globalAlpha = s.life/100;
        drawHeart(s.x, s.y, s.size, "hotpink");
        ctx.globalAlpha = 1;
        if(s.life<=0) sparkles.splice(i,1);
      }

      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
