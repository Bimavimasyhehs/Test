<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIMZ - Cyber Font</title>

    <!-- Link Google Font Cyber Style -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .cyber-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 100px;
            color: #00ffcc;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ff99, 0 0 40px #00ff66;
        }
    </style>
</head>
<body>
    <h1 class="cyber-text">BIMZ</h1>
</body>
</html>
