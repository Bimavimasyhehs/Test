<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRANK!</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
        }

        .container {
            perspective: 1000px;
        }

        .text-3d {
            font-size: 5rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            text-align: center;
            line-height: 1;
            cursor: pointer;
            
            /* Animasi Utama */
            animation: goyang 3s infinite ease-in-out, warna-warni 2s infinite linear;
            
            /* Efek Bayangan 3D Layered */
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15),
                0 0 20px rgba(255, 0, 0, 0.8); /* Glow awal merah */
        }

        /* Animasi Gerakan 3D */
        @keyframes goyang {
            0%, 100% {
                transform: rotateX(20deg) rotateY(-20deg) rotateZ(0deg) scale(1);
            }
            50% {
                transform: rotateX(-20deg) rotateY(20deg) rotateZ(2deg) scale(1.1);
            }
        }

        /* Animasi Perubahan Warna & Glow */
        @keyframes warna-warni {
            0% { color: #ff0000; text-shadow: 0 0 30px #ff0000; }
            25% { color: #ffff00; text-shadow: 0 0 30px #ffff00; }
            50% { color: #00ff00; text-shadow: 0 0 30px #00ff00; }
            75% { color: #00ffff; text-shadow: 0 0 30px #00ffff; }
            100% { color: #ff00ff; text-shadow: 0 0 30px #ff00ff; }
        }

        /* Tambahan efek latar belakang biar makin rame */
        body::before {
            content: "🤡";
            position: absolute;
            font-size: 20rem;
            opacity: 0.1;
            z-index: -1;
            animation: spin 10s infinite linear;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-3d">
            SELAMAT ANDA<br>KENA PRANK
        </div>
    </div>

</body>
</html>
